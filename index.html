<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encore</title>
    <meta name="description" content="A music streaming web app with full-length tracks from Audius.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%231db954'/%3E%3Cpath d='M40 28v34a10 10 0 1 0 6 9V40l24-6v22a10 10 0 1 0 6 9V21z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <a class="logo" href="#/">
                <i class="fas fa-headphones"></i>
                <h2>Encore</h2>
            </a>

            <nav class="navigation" aria-label="Main">
                <ul>
                    <li><a href="#/" data-route="/"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="#/search" data-route="/search"><i class="fas fa-search"></i> Search</a></li>
                    <li><a href="#/library" data-route="/library"><i class="fas fa-list"></i> Your Library</a></li>
                </ul>
            </nav>

            <nav class="playlists" aria-label="Playlists">
                <h3>Playlists</h3>
                <ul id="playlist-list"></ul>
            </nav>

            <p class="credit">Music from <a href="https://audius.co" target="_blank" rel="noopener">Audius</a></p>
        </aside>

        <main class="main-content">
            <header class="header">
                <form class="search-bar" id="search-form" role="search">
                    <input type="search" id="search-input" placeholder="Search for songs, artists..." aria-label="Search for songs or artists">
                    <button type="submit" id="search-btn" aria-label="Search"><i class="fas fa-search"></i></button>
                </form>
            </header>

            <section class="content">
                <h2 id="view-title">Popular Songs</h2>
                <p class="view-subtitle" id="view-subtitle"></p>
                <p class="view-message" id="view-message" role="status"></p>
                <div class="music-grid" id="music-grid"></div>
            </section>
        </main>
    </div>

    <div class="player" role="region" aria-label="Player">
        <div class="player-left">
            <img id="current-song-image" alt="">
            <div class="song-info">
                <h4 id="current-song-title">Select a song</h4>
                <p id="current-song-artist">Artist</p>
                <p id="player-status" class="player-status" role="status"></p>
            </div>
            <button id="like-btn" class="like-button" aria-label="Add to favorites" aria-pressed="false" disabled><i class="far fa-heart"></i></button>
        </div>

        <div class="player-center">
            <div class="controls">
                <button id="prev-btn" aria-label="Previous"><i class="fas fa-step-backward"></i></button>
                <button id="play-btn" aria-label="Play"><i class="fas fa-play"></i></button>
                <button id="next-btn" aria-label="Next"><i class="fas fa-step-forward"></i></button>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <button id="volume-btn" aria-label="Mute"><i class="fas fa-volume-up"></i></button>
            <div class="volume-slider">
                <input type="range" min="0" max="100" value="75" id="volume-control" aria-label="Volume">
            </div>
        </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script type="module" src="js/main.js"></script>
</body>
</html>
